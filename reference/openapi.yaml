openapi: 3.1.0
info:
  title: Nexus API
  version: 2.1.0
  description: |
    The Nexus API lets you manage datasets, pipelines, and webhooks
    programmatically. All endpoints require authentication via an API key.
  contact:
    name: Nexus Support
    email: support@nexus.example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.nexus.example.com/v2
    description: Production
  - url: https://api.staging.nexus.example.com/v2
    description: Staging
security:
  - ApiKeyAuth: []
tags:
  - name: Datasets
    description: Create and manage datasets.
  - name: Pipelines
    description: Build and run data pipelines.
  - name: Webhooks
    description: Subscribe to real-time event notifications.
paths:
  /datasets:
    servers:
      - url: https://api.nexus.datasets.example.com/v2
        description: Production
      - url: https://api.staging.nexus.datasets.example.com/v2
        description: Staging
    get:
      operationId: listDatasets
      tags:
        - Datasets
      summary: List datasets
      description: Returns a paginated list of all datasets in your workspace.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          description: Filter by dataset status.
          schema:
            type: string
            enum:
              - active
              - archived
              - processing
      responses:
        '200':
          description: A paginated list of datasets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      servers:
        - url: https://api.nexus.datasets.post.example.com/v2
          description: Production
        - url: https://api.staging.nexus.datasets.post.example.com/v2
          description: Staging
      operationId: createDataset
      tags:
        - Datasets
      summary: Create a dataset
      description: Creates a new dataset in your workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreate'
      responses:
        '201':
          description: Dataset created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /datasets/{datasetId}:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    servers:
      - url: https://api.nexus.datasets.dataset.example.com/v2
        description: Production
      - url: https://api.staging.nexus.datasets.dataset.example.com/v2
        description: Staging
    get:
      operationId: getDataset
      tags:
        - Datasets
      summary: Get a dataset
      description: Returns a single dataset by ID.
      responses:
        '200':
          description: The requested dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateDataset
      tags:
        - Datasets
      summary: Update a dataset
      description: Updates mutable fields on a dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetUpdate'
      responses:
        '200':
          description: Dataset updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDataset
      tags:
        - Datasets
      summary: Delete a dataset
      description: Permanently deletes a dataset and all of its records.
      responses:
        '204':
          description: Dataset deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /datasets/{datasetId}/records:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    get:
      operationId: listRecords
      tags:
        - Datasets
      summary: List records
      description: Returns a paginated list of records in a dataset.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: A paginated list of records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createRecord
      tags:
        - Datasets
      summary: Create a record
      description: Appends a new record to a dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCreate'
      responses:
        '201':
          description: Record created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /pipelines:
    get:
      operationId: listPipelines
      tags:
        - Pipelines
      summary: List pipelines
      description: Returns all pipelines in your workspace.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: A paginated list of pipelines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createPipeline
      tags:
        - Pipelines
      summary: Create a pipeline
      description: Creates a new pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineCreate'
      responses:
        '201':
          description: Pipeline created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /pipelines/{pipelineId}:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    get:
      operationId: getPipeline
      tags:
        - Pipelines
      summary: Get a pipeline
      responses:
        '200':
          description: The requested pipeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deletePipeline
      tags:
        - Pipelines
      summary: Delete a pipeline
      responses:
        '204':
          description: Pipeline deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /pipelines/{pipelineId}/runs:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    get:
      operationId: listRuns
      tags:
        - Pipelines
      summary: List runs
      description: Returns all runs for a pipeline, newest first.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: A paginated list of pipeline runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: triggerRun
      tags:
        - Pipelines
      summary: Trigger a run
      description: Manually triggers a pipeline run.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parameters:
                  type: object
                  additionalProperties: true
                  description: Runtime parameters to pass to the pipeline.
      responses:
        '202':
          description: Run accepted and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A run is already in progress for this pipeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /webhooks:
    get:
      operationId: listWebhooks
      tags:
        - Webhooks
      summary: List webhooks
      responses:
        '200':
          description: A list of webhooks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createWebhook
      tags:
        - Webhooks
      summary: Create a webhook
      description: Registers a new webhook endpoint to receive event notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
      responses:
        '201':
          description: Webhook created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /webhooks/{webhookId}:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteWebhook
      tags:
        - Webhooks
      summary: Delete a webhook
      responses:
        '204':
          description: Webhook deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Nexus-Api-Key
  parameters:
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
        example: ds_01hx3k9p2m
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema:
        type: string
        example: pl_01hx3k9p2m
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Dataset:
      type: object
      required:
        - id
        - name
        - status
        - record_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: ds_01hx3k9p2m
        name:
          type: string
          example: Q1 Sales Data
        description:
          type: string
          example: Aggregated sales figures for Q1 2026.
        status:
          type: string
          enum:
            - active
            - archived
            - processing
          example: active
        record_count:
          type: integer
          example: 48302
        tags:
          type: array
          items:
            type: string
          example:
            - sales
            - finance
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DatasetCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Q1 Sales Data
        description:
          type: string
        tags:
          type: array
          items:
            type: string
    DatasetUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - active
            - archived
        tags:
          type: array
          items:
            type: string
    DatasetList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Record:
      type: object
      required:
        - id
        - dataset_id
        - data
        - created_at
      properties:
        id:
          type: string
          example: rec_01hx3kbq7n
        dataset_id:
          type: string
          example: ds_01hx3k9p2m
        data:
          type: object
          additionalProperties: true
          description: Arbitrary key-value payload for this record.
        created_at:
          type: string
          format: date-time
    RecordCreate:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: true
    RecordList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Record'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pipeline:
      type: object
      required:
        - id
        - name
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: pl_01hx3k9p2m
        name:
          type: string
          example: Nightly Sales Aggregation
        description:
          type: string
        status:
          type: string
          enum:
            - active
            - paused
            - draft
          example: active
        schedule:
          type: string
          description: Cron expression for scheduled runs.
          example: 0 2 * * *
        source_dataset_id:
          type: string
          example: ds_01hx3k9p2m
        destination_dataset_id:
          type: string
          example: ds_01hx3kbq7n
        last_run_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PipelineCreate:
      type: object
      required:
        - name
        - source_dataset_id
        - destination_dataset_id
      properties:
        name:
          type: string
        description:
          type: string
        schedule:
          type: string
          description: Cron expression. Omit for manual-only pipelines.
        source_dataset_id:
          type: string
        destination_dataset_id:
          type: string
    PipelineList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Pipeline'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Run:
      type: object
      required:
        - id
        - pipeline_id
        - status
        - created_at
      properties:
        id:
          type: string
          example: run_01hx3kcz4p
        pipeline_id:
          type: string
          example: pl_01hx3k9p2m
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
          example: queued
        records_processed:
          type: integer
          example: 0
        error:
          type: string
          description: Human-readable error message, populated on failure.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    RunList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Webhook:
      type: object
      required:
        - id
        - url
        - events
        - created_at
      properties:
        id:
          type: string
          example: wh_01hx3kdm8r
        url:
          type: string
          format: uri
          example: https://example.com/hooks/nexus
        events:
          type: array
          items:
            type: string
            enum:
              - dataset.created
              - dataset.updated
              - dataset.deleted
              - pipeline.run.started
              - pipeline.run.succeeded
              - pipeline.run.failed
          example:
            - pipeline.run.succeeded
            - pipeline.run.failed
        secret:
          type: string
          description: HMAC secret used to sign payloads. Returned only on creation.
        created_at:
          type: string
          format: date-time
    WebhookCreate:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - dataset.created
              - dataset.updated
              - dataset.deleted
              - pipeline.run.started
              - pipeline.run.succeeded
              - pipeline.run.failed
    WebhookList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
    Pagination:
      type: object
      required:
        - page
        - per_page
        - total
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 142
        next_page:
          type: integer
          nullable: true
          example: 2
        prev_page:
          type: integer
          nullable: true
          example: null
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: not_found
        message:
          type: string
          example: The requested resource could not be found.
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: The request body or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests. Retry after the indicated delay.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit resets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
